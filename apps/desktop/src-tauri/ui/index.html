<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weflow</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: "Geist", system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      body {
        display: flex; align-items: center; justify-content: center;
        color: #1c1917;
        background:
          radial-gradient(1100px 540px at 12% -12%, rgba(0,0,0,.05) 0%, transparent 60%),
          radial-gradient(900px 480px at 112% 112%, rgba(0,0,0,.035) 0%, transparent 55%),
          #fafaf9;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #e7e5e4;
          background:
            radial-gradient(1100px 540px at 12% -12%, rgba(255,255,255,.05) 0%, transparent 60%),
            radial-gradient(900px 480px at 112% 112%, rgba(255,255,255,.035) 0%, transparent 55%),
            #0c0a09;
        }
        .sub, .hint { color: #a8a29e !important; }
        input { background: rgba(28,25,23,.6) !important; border-color: #44403c !important; color: #e7e5e4 !important; }
        input:focus { border-color: #d6d3d1 !important; box-shadow: 0 0 0 3px rgba(255,255,255,.08) !important; }
        button.primary { background: #e7e5e4 !important; border-color: #e7e5e4 !important; color: #0c0a09 !important; }
        .meta { color: #57534e !important; }
      }
      .wrap { width: 100%; max-width: 30rem; padding: 2.5rem 2.2rem; }

      .brandline { display: flex; align-items: center; gap: .6rem; font-size: .92rem; font-weight: 600; letter-spacing: -.01em; }
      .brandline svg { flex: none; }
      .brandline b { font-weight: 800; }

      .stage { padding: 2.2rem 0 1.6rem; }
      /* 签名时刻：波浪 logo 按笔顺自绘制 */
      .wave-draw {
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: draw 1.1s cubic-bezier(0.16, 1, 0.3, 1) .15s forwards;
      }
      .underline-draw { animation-delay: .55s; animation-duration: .5s; }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      .wordmark {
        font-size: clamp(3.2rem, 7vw, 4.6rem); line-height: .95;
        letter-spacing: -.045em; margin: .4rem 0 0; user-select: none;
      }
      .wordmark .thin { color: #78716c; font-weight: 500; }
      .anim-rise { animation: rise .7s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: var(--d, 0ms); }
      @keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
      @media (prefers-reduced-motion: reduce) {
        .anim-rise, .wave-draw { animation: none; }
        .wave-draw { stroke-dashoffset: 0; }
      }

      .sub { color: #78716c; font-size: .92rem; margin: 1.1rem 0 0; line-height: 1.65; }
      .status { display: flex; align-items: center; gap: .6rem; margin: 1.3rem 0 .2rem; font-size: .9rem; color: #57534e; }
      .spinner {
        width: .95rem; height: .95rem; border-radius: 50%; flex: none;
        border: 2px solid #d6d3d1; border-top-color: currentColor;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg) } }
      .status.ok .spinner { display: none; }
      label { display: block; font-size: .78rem; color: #78716c; letter-spacing: .12em; text-transform: uppercase; margin: 1.15rem 0 .4rem; }
      input { width: 100%; padding: .65rem .8rem; font-size: .95rem;
              border: 1px solid #d6d3d1; border-radius: 9px; background: rgba(255,255,255,.65); color: inherit;
              transition: border-color .15s, box-shadow .15s; }
      input:focus { outline: none; border-color: #1c1917; box-shadow: 0 0 0 3px rgba(0,0,0,.06); }
      .row { display: flex; gap: .6rem; margin-top: 1.2rem; }
      button.primary {
        display: flex; align-items: center; justify-content: space-between; width: 100%;
        padding: .65rem 1.1rem; font-size: .95rem; border-radius: 9px; border: 1px solid transparent;
        background: #1c1917; color: #fafaf9; cursor: pointer;
        transition: opacity .15s, transform .3s cubic-bezier(0.16,1,0.3,1);
      }
      button.primary:hover { transform: translateY(-1px); }
      button.primary:disabled { opacity: .5; cursor: default; transform: none; }
      .arrow { transition: transform .3s cubic-bezier(0.16,1,0.3,1); }
      button.primary:hover .arrow { transform: translateX(3px); }
      .hint { font-size: .8rem; color: #a8a29e; margin-top: 1.3rem; line-height: 1.7; }
      .hint code { background: rgba(0,0,0,.05); padding: .08rem .35rem; border-radius: 4px; font-size: .92em; }
      .error { color: #dc2626; font-size: .85rem; min-height: 1.2rem; margin-top: .6rem; }
      .meta { font-size: .72rem; color: #a8a29e; margin-top: 2rem; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brandline anim-rise" style="--d: 0ms">
        <svg width="22" height="22" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
          <path d="M5 21c3-11 7 11 11 0s7 11 11 0" />
          <path d="M5 26h22" opacity=".35" />
        </svg>
        <span><b>We</b>Flow</span>
      </div>

      <div class="stage">
        <svg
          class="anim-rise" style="--d: 60ms"
          width="150" height="150" viewBox="0 0 32 32"
          fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true"
        >
          <path class="wave-draw" d="M5 21c3-11 7 11 11 0s7 11 11 0" stroke-width="2.6" pathLength="1" />
          <path class="wave-draw underline-draw" d="M5 26h22" stroke-width="2.6" opacity=".3" pathLength="1" />
        </svg>
        <h1 class="wordmark anim-rise" style="--d: 200ms">We<span class="thin">Flow</span></h1>
        <p class="sub anim-rise" style="--d: 340ms">连接客服工作台</p>
      </div>

      <div class="status anim-rise" id="status" style="--d: 420ms">
        <span id="dot" class="spinner"></span>
        <span id="statusText">正在连接…</span>
      </div>

      <div id="form" class="hidden">
        <label for="url">服务器地址</label>
        <input id="url" type="text" spellcheck="false" placeholder="https://web.leaif.com" />
        <div class="row">
          <button id="connect" class="primary">
            <span>连接</span>
            <span class="arrow">→</span>
          </button>
        </div>
        <div id="error" class="error"></div>
        <p class="hint">
          地址会记住，下次启动自动连接；远程接入需 <code>https</code>。
          命令行 <code>--url &lt;地址&gt;</code> 可临时覆盖。
        </p>
      </div>

      <p class="meta">内部系统 · 账号由管理员发放</p>
    </div>

    <script>
      const invoke = (cmd, args) =>
        (window.__TAURI__ && window.__TAURI__.core
          ? window.__TAURI__.core.invoke(cmd, args)
          : Promise.reject(new Error("非桌面端环境")));

      const statusEl = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const form = document.getElementById("form");
      const urlInput = document.getElementById("url");
      const errorBox = document.getElementById("error");
      const connectBtn = document.getElementById("connect");

      // 状态展示刻意保持中性：不暴露「本机→公网」候选探测过程与地址来源——
      // 使用者只需要知道「正在连接」与「连不上怎么办」两件事。
      function setStatus(kind, text) {
        statusEl.className = "status anim-rise" + (kind ? " " + kind : "");
        statusText.textContent = text;
      }

      function withShellMarker(url) {
        try {
          const target = new URL(url);
          target.searchParams.set("shell", "desktop");
          return target.toString();
        } catch {
          return url;
        }
      }

      function showForm(url, message) {
        form.classList.remove("hidden");
        if (url) urlInput.value = url;
        errorBox.textContent = message || "";
        connectBtn.disabled = false;
      }

      async function probe(url) {
        try {
          return await invoke("probe_server", { url });
        } catch {
          return false;
        }
      }

      async function tryConnect(url) {
        setStatus("busy", "正在连接…");
        const reachable = await probe(url);
        if (reachable) {
          setStatus("ok", "已连接，正在打开工作台");
          location.replace(withShellMarker(url));
          return true;
        }
        setStatus("bad", "连接失败");
        showForm(url, "目标地址没有响应，请检查服务是否已启动、地址是否正确。");
        return false;
      }

      async function boot() {
        let info;
        try {
          info = await invoke("current_server");
        } catch (err) {
          setStatus("bad", "无法读取配置");
          showForm("http://127.0.0.1:3100", err && err.message ? err.message : String(err));
          return;
        }
        urlInput.value = info.url || "";
        const candidates =
          info.candidates && info.candidates.length ? info.candidates : [info.url];
        // 显式配置过的地址：只连它；失败才露出表单。
        if (info.source !== "default") {
          await tryConnect(info.url);
          return;
        }
        // 未配置：后台静默依次尝试候选（不展示探测过程），全部失败才停在表单。
        for (const url of candidates) {
          setStatus("busy", "正在连接…");
          if (await probe(url)) {
            setStatus("ok", "已连接，正在打开工作台");
            location.replace(withShellMarker(url));
            return;
          }
        }
        setStatus("bad", "无法连接服务器");
        showForm(info.url, "自动连接未成功，请检查网络后重试，或手动填写服务器地址。");
      }

      connectBtn.addEventListener("click", async () => {
        const url = urlInput.value.trim();
        errorBox.textContent = "";
        if (!url) {
          errorBox.textContent = "请填写服务器地址";
          return;
        }
        connectBtn.disabled = true;
        setStatus("busy", "正在连接…");
        try {
          await invoke("save_server_url", { url });
        } catch (err) {
          connectBtn.disabled = false;
          setStatus("bad", "连接失败");
          errorBox.textContent = err && err.message ? err.message : String(err);
          return;
        }
        const reachable = await probe(url);
        if (reachable) {
          setStatus("ok", "已连接，正在打开工作台");
          location.replace(withShellMarker(url));
          return;
        }
        setStatus("bad", "连接失败");
        showForm(url, "目标地址没有响应，请检查服务是否已启动、地址是否正确。");
      });

      urlInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !connectBtn.disabled) {
          connectBtn.click();
        }
      });

      boot();
    </script>
  </body>
</html>
