<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weflow</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      body {
        display: flex; align-items: center; justify-content: center;
        color: #1c1917;
        background:
          radial-gradient(1200px 600px at 20% -10%, #e7e5e4 0%, transparent 60%),
          radial-gradient(900px 500px at 110% 110%, #dbeafe 0%, transparent 55%),
          #fafaf9;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #e7e5e4;
          background:
            radial-gradient(1200px 600px at 20% -10%, #27272a 0%, transparent 60%),
            radial-gradient(900px 500px at 110% 110%, #172554 0%, transparent 55%),
            #0c0a09;
        }
        .card { background: rgba(28,25,23,.82) !important; border-color: #292524 !important; }
        .sub { color: #a8a29e !important; }
        input { background: #1c1917 !important; border-color: #44403c !important; color: #e7e5e4 !important; }
        .hint { color: #78716c !important; }
        .hint code { background: #292524 !important; color: #d6d3d1 !important; }
      }
      .card {
        width: 100%; max-width: 24rem; margin: 1rem;
        padding: 2.2rem 2rem 1.6rem;
        background: rgba(255,255,255,.86);
        border: 1px solid #e7e5e4; border-radius: 14px;
        box-shadow: 0 18px 50px -18px rgba(0,0,0,.22);
        backdrop-filter: blur(6px);
      }
      .brand { display: flex; align-items: center; gap: .6rem; margin-bottom: .4rem; }
      .mark {
        width: 1.9rem; height: 1.9rem; border-radius: 8px; flex: none;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: #fff; font-weight: 700; font-size: 1rem;
        display: flex; align-items: center; justify-content: center;
      }
      h1 { font-size: 1.15rem; margin: 0; letter-spacing: .01em; }
      .sub { color: #78716c; font-size: .88rem; margin: .3rem 0 0; line-height: 1.55; }
      .spinner {
        width: .95rem; height: .95rem; border-radius: 50%; flex: none;
        border: 2px solid #d6d3d1; border-top-color: #2563eb;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg) } }
      .status { display: flex; align-items: center; gap: .6rem; margin: 1.4rem 0 .2rem; font-size: .9rem; color: #57534e; }
      .status.ok .spinner { display: none; }
      label { display: block; font-size: .85rem; color: #57534e; margin: 1.15rem 0 .35rem; }
      input { width: 100%; padding: .6rem .75rem; font-size: .95rem;
              border: 1px solid #d6d3d1; border-radius: 8px; background: #fff; color: inherit;
              transition: border-color .15s, box-shadow .15s; }
      input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
      .row { display: flex; gap: .6rem; margin-top: 1rem; }
      button { padding: .6rem 1.1rem; font-size: .95rem; border-radius: 8px; border: 1px solid #d6d3d1;
               background: #fff; color: inherit; cursor: pointer; transition: filter .15s, opacity .15s; }
      button:hover { filter: brightness(.97); }
      button.primary { background: #2563eb; border-color: #2563eb; color: #fff; flex: 1; }
      button.primary:hover { filter: brightness(1.06); }
      button:disabled { opacity: .5; cursor: default; }
      .hint { font-size: .8rem; color: #a8a29e; margin-top: 1.2rem; line-height: 1.65; }
      code { background: #f5f5f4; padding: .08rem .35rem; border-radius: 4px; font-size: .92em; }
      .error { color: #dc2626; font-size: .85rem; min-height: 1.2rem; margin-top: .6rem; }
      .hidden { display: none; }
      .fade-in { animation: fadein .35s ease; }
      @keyframes fadein { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    </style>
  </head>
  <body>
    <div class="card fade-in">
      <div class="brand">
        <div class="mark">W</div>
        <h1>Weflow</h1>
      </div>
      <p class="sub">连接客服工作台</p>

      <div class="status" id="status">
        <span id="dot" class="spinner"></span>
        <span id="statusText">正在连接…</span>
      </div>

      <div id="form" class="hidden">
        <label for="url">服务器地址</label>
        <input id="url" type="text" spellcheck="false" placeholder="https://web.leaif.com" />
        <div class="row">
          <button id="connect" class="primary">连接</button>
        </div>
        <div id="error" class="error"></div>
        <p class="hint">
          地址会记住，下次启动自动连接；远程接入需 <code>https</code>。
          命令行 <code>--url &lt;地址&gt;</code> 可临时覆盖。
        </p>
      </div>
    </div>

    <script>
      const invoke = (cmd, args) =>
        (window.__TAURI__ && window.__TAURI__.core
          ? window.__TAURI__.core.invoke(cmd, args)
          : Promise.reject(new Error("非桌面端环境")));

      const statusEl = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const form = document.getElementById("form");
      const urlInput = document.getElementById("url");
      const errorBox = document.getElementById("error");
      const connectBtn = document.getElementById("connect");

      // 状态展示刻意保持中性：不暴露「本机→公网」候选探测过程与地址来源——
      // 使用者只需要知道「正在连接」与「连不上怎么办」两件事。
      function setStatus(kind, text) {
        statusEl.className = "status" + (kind ? " " + kind : "");
        statusText.textContent = text;
      }

      function withShellMarker(url) {
        try {
          const target = new URL(url);
          target.searchParams.set("shell", "desktop");
          return target.toString();
        } catch {
          return url;
        }
      }

      function showForm(url, message) {
        form.classList.remove("hidden");
        if (url) urlInput.value = url;
        errorBox.textContent = message || "";
        connectBtn.disabled = false;
      }

      async function probe(url) {
        try {
          return await invoke("probe_server", { url });
        } catch {
          return false;
        }
      }

      async function tryConnect(url) {
        setStatus("busy", "正在连接…");
        const reachable = await probe(url);
        if (reachable) {
          setStatus("ok", "已连接，正在打开工作台");
          location.replace(withShellMarker(url));
          return true;
        }
        setStatus("bad", "连接失败");
        showForm(url, "目标地址没有响应，请检查服务是否已启动、地址是否正确。");
        return false;
      }

      async function boot() {
        let info;
        try {
          info = await invoke("current_server");
        } catch (err) {
          setStatus("bad", "无法读取配置");
          showForm("http://127.0.0.1:3100", err && err.message ? err.message : String(err));
          return;
        }
        urlInput.value = info.url || "";
        const candidates =
          info.candidates && info.candidates.length ? info.candidates : [info.url];
        // 显式配置过的地址：只连它；失败才露出表单。
        if (info.source !== "default") {
          await tryConnect(info.url);
          return;
        }
        // 未配置：后台静默依次尝试候选（不展示探测过程），全部失败才停在表单。
        for (const url of candidates) {
          setStatus("busy", "正在连接…");
          if (await probe(url)) {
            setStatus("ok", "已连接，正在打开工作台");
            location.replace(withShellMarker(url));
            return;
          }
        }
        setStatus("bad", "无法连接服务器");
        showForm(info.url, "自动连接未成功，请检查网络后重试，或手动填写服务器地址。");
      }

      connectBtn.addEventListener("click", async () => {
        const url = urlInput.value.trim();
        errorBox.textContent = "";
        if (!url) {
          errorBox.textContent = "请填写服务器地址";
          return;
        }
        connectBtn.disabled = true;
        setStatus("busy", "正在连接…");
        try {
          await invoke("save_server_url", { url });
        } catch (err) {
          connectBtn.disabled = false;
          setStatus("bad", "连接失败");
          errorBox.textContent = err && err.message ? err.message : String(err);
          return;
        }
        const reachable = await probe(url);
        if (reachable) {
          setStatus("ok", "已连接，正在打开工作台");
          location.replace(withShellMarker(url));
          return;
        }
        setStatus("bad", "连接失败");
        showForm(url, "目标地址没有响应，请检查服务是否已启动、地址是否正确。");
      });

      urlInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !connectBtn.disabled) {
          connectBtn.click();
        }
      });

      boot();
    </script>
  </body>
</html>
