<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Weflow</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; background: #f5f6f8; color: #333; }
      .box { text-align: center; max-width: 32rem; padding: 2rem; }
      h1 { font-size: 1.25rem; margin-bottom: .5rem; }
      p { color: #666; line-height: 1.6; }
      code { background: #e8eaed; padding: .1rem .4rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>无法连接 Weflow 服务</h1>
      <p>请确认 Weflow 服务已在本机或远程服务器上运行。<br />加载地址可在本程序同目录的 <code>weflow.conf</code> 中配置：</p>
      <p><code>{ "url": "http://127.0.0.1:3100" }</code></p>
    </div>
  </body>
</html>
