[package]
name = "weflow-desktop"
version = "2.0.0"
description = "Weflow AI 客服产品桌面端壳（Tauri WebView2）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "weflow-desktop"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
